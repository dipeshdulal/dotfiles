onboarding = false

[theme]
# Kept on the terminal's own palette (what this machine already used).
# archtower used a catppuccin-macchiato palette; it is preserved at the bottom
# of this file if you ever want it back.
name = "terminal"

[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read.
panel_bg = "black"

[terminal]
# Follow the pane's cwd on every split, tab and workspace, like tmux's
# -c "#{pane_current_path}".
new_cwd = "follow"

[ui]
show_agent_labels_on_pane_borders = true
accent = "blue"

# Panes sit flush (border only), no blank gutter between them.
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false

# Closing never asked for confirmation in tmux.
confirm_close = false
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set-titles-string '#h:#W'
window_title = "{hostname}: {workspace}"

[keys]
# tmux-aligned bindings. Prefix stays ctrl+b (same as tmux). The Omarchy
# default was ctrl+space, which collides with the fcitx5 input-method toggle.
prefix = "ctrl+b"

# Overrides where herdr's default differs from canonical tmux:
detach = "prefix+d"            # tmux: prefix d   (herdr default was prefix+q)
rename_tab = "prefix+comma"    # tmux: prefix ,   (herdr default was prefix+shift+t)
close_tab = "prefix+ampersand" # tmux: prefix &   (herdr default was prefix+shift+x)

# Direct ctrl+h/j/k/l is handled by the vim-herdr-navigation plugin (see the
# commented [[keys.command]] blocks at the bottom) so it also drives nvim
# splits seamlessly. Keep prefix+h/j/k/l as a fallback to step out of non-vim
# TUIs (lazygit, k9s...).
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# herdr defaults that already match tmux (explicit for clarity):
new_tab = "prefix+c"           # tmux: prefix c
next_tab = "prefix+n"          # tmux: prefix n
previous_tab = "prefix+p"      # tmux: prefix p
switch_tab = "prefix+1..9"     # tmux: prefix 1..9
zoom = "prefix+z"              # tmux: prefix z
close_pane = "prefix+x"        # tmux: prefix x (kill pane)
help = "prefix+?"              # tmux: prefix ?

# splits: tmux %/" aren't bindable in herdr; use the literal pipe char
split_vertical = "prefix+|"    # prefix + |  (tmux-plugin convention)
split_horizontal = "prefix+minus"

# ---------------------------------------------------------------------------
# Disabled until vim-herdr-navigation is restored.
#
# These four binds forward ctrl+h/j/k/l into nvim splits when the focused pane
# is vim/nvim, and otherwise move the herdr pane. The plugin lived at
# ~/projects/vim-herdr-navigation on archtower and is inside
# ~/Backups/archtower/archtower-home-*.tar.zst. Restore it, run
#   herdr plugin link <path>
# then uncomment. Without the plugin these binds error on every keypress.
#
# [[keys.command]]
# key = "ctrl+h"
# type = "plugin_action"
# command = "vim-herdr-navigation.left"
# description = "navigate left (vim/herdr)"
#
# [[keys.command]]
# key = "ctrl+j"
# type = "plugin_action"
# command = "vim-herdr-navigation.down"
# description = "navigate down (vim/herdr)"
#
# [[keys.command]]
# key = "ctrl+k"
# type = "plugin_action"
# command = "vim-herdr-navigation.up"
# description = "navigate up (vim/herdr)"
#
# [[keys.command]]
# key = "ctrl+l"
# type = "plugin_action"
# command = "vim-herdr-navigation.right"
# description = "navigate right (vim/herdr)"
# ---------------------------------------------------------------------------

[experimental]
# Enable Kitty graphics protocol support for inline images in Herdr panes.
kitty_graphics = true

