onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
pane_gaps = false   # panes sit flush (border only), no blank gutter between them

[theme]
# Base is "catppuccin" (Mocha); the tokens below override it to opencode's
# built-in "catppuccin-macchiato" palette so Herdr chrome matches the opencode
# panes. Source of truth: opencode theme `catppuccin-macchiato` (macchiato roles).
name = "catppuccin"
auto_switch = false

# opencode role -> herdr token:
#   background        -> panel_bg
#   backgroundPanel   -> sidebar_bg
#   backgroundElement -> active_row_bg
#   border            -> selection_bg / surface0
#   primary           -> accent
#   text / textMuted  -> text / subtext0
[theme.custom]
panel_bg      = "#24273a"  # macBase
sidebar_bg    = "#1e2030"  # macMantle
active_row_bg = "#181926"  # macCrust
selection_bg  = "#363a4f"  # macSurface0
surface0      = "#363a4f"  # macSurface0
surface1      = "#494d64"  # macSurface1
surface_dim   = "#1e2030"  # macMantle
overlay0      = "#6e738d"  # macOverlay0
overlay1      = "#8087a2"  # macOverlay1
text          = "#cad3f5"  # macText
subtext0      = "#a5adcb"  # macSubtext0
accent        = "#c6a0f6"  # macMauve (opencode primary)
mauve         = "#c6a0f6"  # macMauve
green         = "#a6da95"  # macGreen
yellow        = "#eed49f"  # macYellow
red           = "#ed8796"  # macRed
blue          = "#8aadf4"  # macBlue
teal          = "#8bd5ca"  # macTeal
peach         = "#f5a97f"  # macPeach

[keys]
# tmux-aligned bindings. Prefix stays ctrl+b (same as tmux).
prefix = "ctrl+b"

# Overrides where herdr's default differs from canonical tmux:
detach = "prefix+d"            # tmux: prefix d   (herdr default was prefix+q)
rename_tab = "prefix+comma"    # tmux: prefix ,   (herdr default was prefix+shift+t)
close_tab = "prefix+ampersand" # tmux: prefix &   (herdr default was prefix+shift+x)

# Direct ctrl+h/j/k/l is handled by the vim-herdr-navigation plugin
# (see [[keys.command]] at the bottom) so it also drives nvim splits seamlessly.
# Keep prefix+h/j/k/l as a fallback to step out of non-vim TUIs (lazygit, k9s...).
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# herdr defaults that already match tmux (explicit for clarity):
new_tab = "prefix+c"           # tmux: prefix c
next_tab = "prefix+n"          # tmux: prefix n
previous_tab = "prefix+p"      # tmux: prefix p
switch_tab = "prefix+1..9"     # tmux: prefix 1..9
zoom = "prefix+z"              # tmux: prefix z
close_pane = "prefix+x"        # tmux: prefix x (kill pane)
help = "prefix+?"              # tmux: prefix ?

# splits: tmux %/" aren't bindable in herdr; use the literal pipe char
split_vertical = "prefix+|"    # prefix + |  (tmux-plugin convention)
split_horizontal = "prefix+minus"

# Seamless ctrl+h/j/k/l across herdr panes AND nvim splits, via the
# vim-herdr-navigation plugin. The action checks the focused pane's process:
# if it's vim/nvim it forwards the key; otherwise it moves the herdr pane.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Sidebar agent rows.
# Line 1 is only WHERE the agent lives. Herdr auto-sizes the sidebar to fit
# workspace names, so any extra token on this line (machine, tab, agent) gets
# clipped -- keeping it to workspace guarantees it never truncates.
# Line 2 carries the agent name/kind plus its live terminal title, i.e. what it
# is actually working on. Empty rows collapse, so an agent with no terminal
# title renders as a single line.
[ui.sidebar.agents]
rows = [["state_icon", "workspace"], ["agent", "terminal_title_stripped"]]

[experimental]
# Enable Kitty graphics protocol support for inline images in Herdr panes.
kitty_graphics = true
